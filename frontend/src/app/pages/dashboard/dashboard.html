<section class="dashboard">
  <header class="page-header">
    <h1>Dashboard</h1>
    <p>Accede a los módulos de inventario desde aquí o desde el menú lateral.</p>
  </header>

  <div class="cards">
    @for (item of modules; track item.path) {
      <a class="card" [routerLink]="item.path">
        <h2>{{ item.title }}</h2>
        <p>{{ item.text }}</p>
      </a>
    }
  </div>
</section>
