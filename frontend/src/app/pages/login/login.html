<section class="login-page">
  <div class="login-panel">
    <header class="brand">
      <p class="brand-mark">FacturaAI</p>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Accede al sistema de facturación</p>
    </header>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="username" placeholder="admin@demo.com" />
      </label>

      <label>
        <span>Contraseña</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </label>

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="hint">Demo: admin@demo.com / Admin123!</p>
  </div>
</section>
