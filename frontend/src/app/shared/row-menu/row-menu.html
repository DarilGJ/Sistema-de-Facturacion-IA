<div class="row-menu" (click)="$event.stopPropagation()">
  <button type="button" class="kebab" (click)="toggle($event)" aria-label="Acciones">
    <app-icon name="more" />
  </button>
  @if (open()) {
    <div class="menu" role="menu">
      @if (items().length) {
        @for (item of items(); track item.id) {
          <button type="button" [class.accent]="item.accent" (click)="pick(item.id)">
            <app-icon [name]="item.icon" /> {{ item.label }}
          </button>
        }
      } @else {
        <button type="button" (click)="edit.emit(); open.set(false)">
          <app-icon name="pencil" /> Editar
        </button>
        @if (canPromote()) {
          <button type="button" (click)="promote.emit(); open.set(false)">
            <app-icon name="star" /> {{ promoteLabel() }}
          </button>
        }
        @if (canConvert()) {
          <button type="button" (click)="convert.emit(); open.set(false)">
            <app-icon name="document" /> Convertir
          </button>
        }
        @if (canDeactivate()) {
          <button
            type="button"
            [class.danger]="deactivateDanger()"
            (click)="deactivate.emit(); open.set(false)"
          >
            <app-icon name="rotate" /> {{ deactivateLabel() }}
          </button>
        }
      }
    </div>
  }
</div>
